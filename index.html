<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Asset Strategy Research</title>
<style>
:root {
  --bg: #f8f8f6;
  --surface: #ffffff;
  --surface-alt: #f2f1ee;
  --border: #ddd9d1;
  --border-light: #eae7e1;
  --text: #1a1a18;
  --text-secondary: #5c5a54;
  --text-muted: #8a877f;
  --accent: #2d5a3d;
  --accent-light: #e8f0eb;
  --accent-hover: #3d7a53;
  --score-5: #1a6b3c;
  --score-4: #3a8a5c;
  --score-3: #7a8a3a;
  --score-2: #b08a2a;
  --score-1: #a05a3a;
  --fact: #2d5a3d;
  --inference: #6a5a2d;
  --question: #5a2d6a;
  --badge-launched: #1a6b3c;
  --badge-pilot: #3a7a8a;
  --badge-concept: #8a7a3a;
  --badge-scaled: #2d4a6a;
  --nav-width: 240px;
  --header-height: 56px;
  --font-body: 'Georgia', 'Times New Roman', serif;
  --font-ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --font-mono: 'SF Mono', 'Fira Code', 'Consolas', monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--font-ui);
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.55;
}

/* === HEADER === */
.header {
  position: fixed; top: 0; left: 0; right: 0;
  height: var(--header-height);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center;
  padding: 0 24px;
  z-index: 100;
}
.header h1 {
  font-family: var(--font-body);
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -0.3px;
  color: var(--text);
}
.header h1 span { color: var(--accent); }
.header-meta {
  margin-left: auto;
  font-size: 12px;
  color: var(--text-muted);
}

/* === SIDEBAR === */
.sidebar {
  position: fixed;
  top: var(--header-height);
  left: 0;
  bottom: 0;
  width: var(--nav-width);
  background: var(--surface);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 16px 0;
  z-index: 90;
}
.sidebar-section {
  padding: 0 16px;
  margin-bottom: 20px;
}
.sidebar-section h3 {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  color: var(--text-muted);
  margin-bottom: 8px;
  font-weight: 600;
}
.sidebar-btn {
  display: block;
  width: 100%;
  text-align: left;
  padding: 7px 12px;
  border: none;
  background: none;
  font-size: 13px;
  color: var(--text-secondary);
  cursor: pointer;
  border-radius: 4px;
  font-family: var(--font-ui);
  transition: background 0.15s;
}
.sidebar-btn:hover { background: var(--surface-alt); }
.sidebar-btn.active {
  background: var(--accent-light);
  color: var(--accent);
  font-weight: 600;
}
.sidebar-search {
  width: 100%;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: 4px;
  font-size: 13px;
  font-family: var(--font-ui);
  background: var(--surface-alt);
  outline: none;
  margin-bottom: 8px;
}
.sidebar-search:focus {
  border-color: var(--accent);
  background: var(--surface);
}

/* === MAIN CONTENT === */
.main {
  margin-left: var(--nav-width);
  margin-top: var(--header-height);
  padding: 24px;
  min-height: calc(100vh - var(--header-height));
}

/* === SUMMARY CARDS === */
.summary-row {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 12px;
  margin-bottom: 24px;
}
.summary-card {
  background: var(--surface);
  border: 1px solid var(--border-light);
  border-radius: 6px;
  padding: 16px;
}
.summary-card .label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--text-muted);
  margin-bottom: 4px;
}
.summary-card .value {
  font-size: 24px;
  font-weight: 700;
  font-family: var(--font-body);
  color: var(--text);
}

/* === FILTER BAR === */
.filter-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 20px;
  align-items: center;
}
.filter-group {
  display: flex;
  gap: 4px;
  align-items: center;
}
.filter-group .filter-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--text-muted);
  margin-right: 4px;
  white-space: nowrap;
}
.filter-chip {
  padding: 4px 10px;
  border: 1px solid var(--border);
  border-radius: 3px;
  font-size: 12px;
  background: var(--surface);
  cursor: pointer;
  font-family: var(--font-ui);
  color: var(--text-secondary);
  transition: all 0.15s;
}
.filter-chip:hover { border-color: var(--accent); color: var(--accent); }
.filter-chip.active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
.filter-sep {
  width: 1px;
  height: 24px;
  background: var(--border);
  margin: 0 4px;
}

/* === COMPANY CARDS === */
.company-grid {
  display: grid;
  gap: 16px;
}
.company-card {
  background: var(--surface);
  border: 1px solid var(--border-light);
  border-radius: 6px;
  overflow: hidden;
  transition: border-color 0.2s;
}
.company-card:hover { border-color: var(--accent); }
.card-header {
  padding: 20px 24px;
  display: flex;
  align-items: flex-start;
  gap: 16px;
  cursor: pointer;
  user-select: none;
}
.card-header-info { flex: 1; }
.card-header-info h2 {
  font-family: var(--font-body);
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 4px;
  color: var(--text);
}
.card-header-info .company-type {
  font-size: 12px;
  color: var(--text-muted);
}
.card-header-info .company-hq {
  font-size: 12px;
  color: var(--text-muted);
}
.card-scores {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-shrink: 0;
}
.score-badge {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 6px 10px;
  border-radius: 4px;
  background: var(--surface-alt);
  min-width: 54px;
}
.score-badge .score-val {
  font-size: 18px;
  font-weight: 700;
  font-family: var(--font-mono);
}
.score-badge .score-label {
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-muted);
  margin-top: 2px;
}
.card-expand-icon {
  font-size: 12px;
  color: var(--text-muted);
  transition: transform 0.2s;
  margin-top: 4px;
}
.company-card.expanded .card-expand-icon { transform: rotate(180deg); }

.card-body {
  display: none;
  border-top: 1px solid var(--border-light);
}
.company-card.expanded .card-body { display: block; }

/* === CARD BODY SECTIONS === */
.card-section {
  padding: 20px 24px;
  border-bottom: 1px solid var(--border-light);
}
.card-section:last-child { border-bottom: none; }
.card-section h3 {
  font-size: 13px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--accent);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.card-section h3 .section-icon {
  font-size: 14px;
}
.card-section p, .card-section li {
  font-size: 13px;
  line-height: 1.6;
  color: var(--text-secondary);
}
.card-section ul {
  list-style: none;
  padding: 0;
}
.card-section ul li {
  padding: 4px 0 4px 16px;
  position: relative;
}
.card-section ul li::before {
  content: '·';
  position: absolute;
  left: 4px;
  color: var(--accent);
  font-weight: bold;
}

/* === PRODUCT TABLE === */
.product-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
  margin-top: 8px;
}
.product-table th {
  text-align: left;
  padding: 8px 10px;
  background: var(--surface-alt);
  font-weight: 600;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-muted);
  border-bottom: 1px solid var(--border);
}
.product-table td {
  padding: 8px 10px;
  border-bottom: 1px solid var(--border-light);
  color: var(--text-secondary);
  vertical-align: top;
}
.product-table tr:last-child td { border-bottom: none; }

/* === BADGES === */
.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 3px;
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.badge-launched { background: #e0f0e8; color: var(--badge-launched); }
.badge-pilot { background: #e0eef0; color: var(--badge-pilot); }
.badge-concept { background: #f0ece0; color: var(--badge-concept); }
.badge-scaled { background: #e0e8f0; color: var(--badge-scaled); }
.badge-active { background: #e0f0e8; color: var(--badge-launched); }
.badge-completed { background: #e8e8e8; color: #666; }
.badge-planned { background: #f0ece0; color: var(--badge-concept); }
.badge-pending { background: #f0ece0; color: var(--badge-concept); }
.badge-unknown { background: #eee; color: #999; }

/* === EVIDENCE === */
.evidence-list { margin-top: 8px; }
.evidence-item {
  padding: 10px 12px;
  background: var(--surface-alt);
  border-radius: 4px;
  margin-bottom: 6px;
  font-size: 12px;
}
.evidence-item .ev-claim {
  color: var(--text);
  font-weight: 500;
  margin-bottom: 4px;
}
.evidence-item .ev-meta {
  color: var(--text-muted);
  font-size: 11px;
}
.evidence-item .ev-meta a {
  color: var(--accent);
  text-decoration: none;
}
.evidence-item .ev-meta a:hover { text-decoration: underline; }

/* === OPEN QUESTIONS === */
.question-list { margin-top: 8px; }
.question-item {
  padding: 6px 12px;
  background: #f5f0fa;
  border-left: 3px solid var(--question);
  margin-bottom: 4px;
  font-size: 12px;
  color: var(--text-secondary);
  border-radius: 0 4px 4px 0;
}

/* === ANALYST JUDGMENT === */
.judgment-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 8px;
}
.judgment-item {
  padding: 10px 12px;
  background: var(--surface-alt);
  border-radius: 4px;
}
.judgment-item .j-label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  color: var(--text-muted);
  margin-bottom: 4px;
  font-weight: 600;
}
.judgment-item .j-value {
  font-size: 12px;
  color: var(--text-secondary);
  line-height: 1.5;
}

/* === COMPARE TABLE === */
.compare-container { overflow-x: auto; }
.compare-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
  min-width: 800px;
}
.compare-table th {
  text-align: left;
  padding: 10px 12px;
  background: var(--surface-alt);
  font-weight: 600;
  font-size: 11px;
  border-bottom: 2px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 1;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.compare-table td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border-light);
  vertical-align: top;
  color: var(--text-secondary);
}
.compare-table tr:hover td { background: var(--accent-light); }
.compare-table .company-name-cell {
  font-weight: 600;
  color: var(--text);
  white-space: nowrap;
}
.score-dot {
  display: inline-block;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  margin-right: 4px;
  vertical-align: middle;
}

/* === TIMELINE === */
.timeline-container { margin-top: 12px; }
.timeline-year {
  margin-bottom: 20px;
}
.timeline-year h4 {
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 8px;
  font-family: var(--font-body);
  border-bottom: 1px solid var(--border);
  padding-bottom: 4px;
}
.timeline-event {
  display: flex;
  align-items: flex-start;
  padding: 6px 0;
  font-size: 12px;
  gap: 12px;
}
.timeline-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent);
  margin-top: 4px;
  flex-shrink: 0;
}
.timeline-company {
  font-weight: 600;
  color: var(--text);
  min-width: 120px;
  flex-shrink: 0;
}
.timeline-desc {
  color: var(--text-secondary);
  flex: 1;
}
.timeline-date {
  color: var(--text-muted);
  font-size: 11px;
  min-width: 80px;
  text-align: right;
  flex-shrink: 0;
}

/* === PEOPLE LIST === */
.people-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 8px;
  margin-top: 8px;
}
.person-chip {
  padding: 8px 12px;
  background: var(--surface-alt);
  border-radius: 4px;
  font-size: 12px;
}
.person-chip .person-name {
  font-weight: 600;
  color: var(--text);
}
.person-chip .person-title {
  color: var(--text-muted);
  font-size: 11px;
  margin-top: 2px;
}

/* === INITIATIVES === */
.initiative-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 0;
  font-size: 12px;
}
.initiative-name { flex: 1; color: var(--text-secondary); }
.initiative-date { color: var(--text-muted); font-size: 11px; min-width: 100px; }

/* === VIEW TABS === */
.view-tabs {
  display: flex;
  gap: 0;
  border-bottom: 2px solid var(--border);
  margin-bottom: 20px;
}
.view-tab {
  padding: 10px 20px;
  border: none;
  background: none;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
  font-family: var(--font-ui);
  transition: all 0.15s;
}
.view-tab:hover { color: var(--text); }
.view-tab.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
  font-weight: 600;
}

/* === VIEW CONTAINERS === */
.view-panel { display: none; }
.view-panel.active { display: block; }

/* === WATCHLIST === */
.watchlist-items {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 6px;
}
.watchlist-tag {
  padding: 3px 10px;
  background: var(--accent-light);
  color: var(--accent);
  border-radius: 3px;
  font-size: 11px;
}

/* === RESPONSIVE === */
@media (max-width: 900px) {
  .sidebar { display: none; }
  .main { margin-left: 0; }
  .judgment-grid { grid-template-columns: 1fr; }
}

/* === SCORE COLORS === */
.sc-5 { color: var(--score-5); }
.sc-4 { color: var(--score-4); }
.sc-3 { color: var(--score-3); }
.sc-2 { color: var(--score-2); }
.sc-1 { color: var(--score-1); }

/* === PRINT === */
@media print {
  .sidebar, .header, .filter-bar, .view-tabs { display: none !important; }
  .main { margin: 0; padding: 12px; }
  .company-card { break-inside: avoid; }
  .card-body { display: block !important; }
}

.no-results {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-muted);
  font-size: 14px;
}
.summary-desc {
  font-family: var(--font-body);
  font-size: 13px;
  line-height: 1.65;
  color: var(--text-secondary);
  margin-top: 8px;
}
.field-row {
  margin-bottom: 12px;
}
.field-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  color: var(--text-muted);
  font-weight: 600;
  margin-bottom: 4px;
}
.field-value {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.55;
}
.partners-list {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 4px;
}
.partner-tag {
  padding: 2px 8px;
  background: var(--surface-alt);
  border-radius: 3px;
  font-size: 11px;
  color: var(--text-secondary);
}
</style>
</head>
<body>

<div class="header">
  <h1>Digital Asset <span>Strategy Research</span></h1>
  <div class="header-meta">v1.0 · Updated 2026-03-18 · 9 Companies</div>
</div>

<div class="sidebar" id="sidebar">
  <div class="sidebar-section">
    <h3>Search</h3>
    <input type="text" class="sidebar-search" id="search-input" placeholder="Search all data...">
  </div>
  <div class="sidebar-section">
    <h3>Views</h3>
    <button class="sidebar-btn active" data-view="cards" onclick="switchView('cards', this)">Company Cards</button>
    <button class="sidebar-btn" data-view="compare" onclick="switchView('compare', this)">Compare Table</button>
    <button class="sidebar-btn" data-view="timeline" onclick="switchView('timeline', this)">Timeline</button>
  </div>
  <div class="sidebar-section">
    <h3>Companies</h3>
    <div id="company-nav"></div>
  </div>
  <div class="sidebar-section">
    <h3>Filters</h3>
    <button class="sidebar-btn filter-clear" onclick="clearFilters()">Clear All Filters</button>
  </div>
</div>

<div class="main" id="main">
  <!-- Summary cards -->
  <div class="summary-row" id="summary-row"></div>

  <!-- Filter bar -->
  <div class="filter-bar" id="filter-bar">
    <div class="filter-group">
      <span class="filter-label">Dimension</span>
      <button class="filter-chip" data-filter="dimension" data-val="people" onclick="toggleFilter(this)">People</button>
      <button class="filter-chip" data-filter="dimension" data-val="process" onclick="toggleFilter(this)">Process</button>
      <button class="filter-chip" data-filter="dimension" data-val="product" onclick="toggleFilter(this)">Product</button>
    </div>
    <div class="filter-sep"></div>
    <div class="filter-group">
      <span class="filter-label">Perspective</span>
      <button class="filter-chip" data-filter="perspective" data-val="business" onclick="toggleFilter(this)">Business</button>
      <button class="filter-chip" data-filter="perspective" data-val="technology" onclick="toggleFilter(this)">Technology</button>
    </div>
    <div class="filter-sep"></div>
    <div class="filter-group">
      <span class="filter-label">Maturity</span>
      <button class="filter-chip" data-filter="maturity" data-val="concept" onclick="toggleFilter(this)">Concept</button>
      <button class="filter-chip" data-filter="maturity" data-val="pilot" onclick="toggleFilter(this)">Pilot</button>
      <button class="filter-chip" data-filter="maturity" data-val="launched" onclick="toggleFilter(this)">Launched</button>
      <button class="filter-chip" data-filter="maturity" data-val="scaled" onclick="toggleFilter(this)">Scaled</button>
    </div>
    <div class="filter-sep"></div>
    <div class="filter-group">
      <span class="filter-label">Score ≥</span>
      <button class="filter-chip" data-filter="score" data-val="3" onclick="toggleFilter(this)">3+</button>
      <button class="filter-chip" data-filter="score" data-val="4" onclick="toggleFilter(this)">4+</button>
      <button class="filter-chip" data-filter="score" data-val="5" onclick="toggleFilter(this)">5</button>
    </div>
  </div>

  <!-- Cards View -->
  <div class="view-panel active" id="view-cards">
    <div class="company-grid" id="company-grid"></div>
  </div>

  <!-- Compare View -->
  <div class="view-panel" id="view-compare">
    <div class="compare-container">
      <table class="compare-table" id="compare-table"></table>
    </div>
  </div>

  <!-- Timeline View -->
  <div class="view-panel" id="view-timeline">
    <div class="timeline-container" id="timeline-container"></div>
  </div>
</div>

<script>
// ===== APPLICATION STATE =====
let companiesIndex = null;
let companyData = {};
let activeFilters = { dimension: null, perspective: null, maturity: null, score: null };
let searchQuery = '';

// ===== DATA LOADING =====
async function loadData() {
  try {
    const indexResp = await fetch('./data/companies.json');
    companiesIndex = await indexResp.json();

    const promises = companiesIndex.companies.map(async (c) => {
      const resp = await fetch(`./data/company-slugs/${c.slug}.json`);
      companyData[c.slug] = await resp.json();
    });
    await Promise.all(promises);

    renderAll();
  } catch (e) {
    document.getElementById('company-grid').innerHTML =
      '<div class="no-results">Error loading data. Ensure JSON files are accessible. If opening locally, use a simple HTTP server (e.g., <code>python3 -m http.server</code>).</div>';
    console.error(e);
  }
}

// ===== RENDERING =====
function renderAll() {
  renderSummary();
  renderNav();
  renderCards();
  renderCompare();
  renderTimeline();
}

function getFilteredCompanies() {
  let list = companiesIndex.companies.slice();
  if (activeFilters.score) {
    const min = parseInt(activeFilters.score);
    list = list.filter(c => c.strategy_intensity_score >= min);
  }
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    list = list.filter(c => {
      const d = companyData[c.slug];
      const blob = JSON.stringify(d).toLowerCase();
      return blob.includes(q);
    });
  }
  return list;
}

function renderSummary() {
  const row = document.getElementById('summary-row');
  const companies = companiesIndex.companies;
  const avg = (arr) => (arr.reduce((a, b) => a + b, 0) / arr.length).toFixed(1);
  const totalProducts = companies.reduce((n, c) => {
    const d = companyData[c.slug];
    return n + (d.product && d.product.products ? d.product.products.length : 0);
  }, 0);
  const avgStrat = avg(companies.map(c => c.strategy_intensity_score));
  const totalEvidence = companies.reduce((n, c) => {
    const d = companyData[c.slug];
    return n + (d.evidence ? d.evidence.length : 0);
  }, 0);
  row.innerHTML = `
    <div class="summary-card"><div class="label">Companies</div><div class="value">${companies.length}</div></div>
    <div class="summary-card"><div class="label">Avg Strategy Score</div><div class="value">${avgStrat}</div></div>
    <div class="summary-card"><div class="label">Products Tracked</div><div class="value">${totalProducts}</div></div>
    <div class="summary-card"><div class="label">Evidence Items</div><div class="value">${totalEvidence}</div></div>
  `;
}

function renderNav() {
  const nav = document.getElementById('company-nav');
  nav.innerHTML = companiesIndex.companies.map(c =>
    `<button class="sidebar-btn" onclick="scrollToCompany('${c.slug}')">${c.company_name} <span style="float:right;color:var(--text-muted);font-size:11px">${c.strategy_intensity_score}/5</span></button>`
  ).join('');
}

function scoreColor(s) {
  return `sc-${s}`;
}

function maturityBadge(m) {
  if (!m) return '';
  return `<span class="badge badge-${m.toLowerCase().replace(/\s/g,'')}">${m}</span>`;
}

function renderCards() {
  const grid = document.getElementById('company-grid');
  const filtered = getFilteredCompanies();

  if (filtered.length === 0) {
    grid.innerHTML = '<div class="no-results">No companies match the current filters.</div>';
    return;
  }

  grid.innerHTML = filtered.map(c => {
    const d = companyData[c.slug];
    return buildCardHTML(d);
  }).join('');
}

function buildCardHTML(d) {
  const showDimension = activeFilters.dimension;
  const showPerspective = activeFilters.perspective;
  const showMaturity = activeFilters.maturity;

  // Filter products by maturity if set
  let products = d.product && d.product.products ? d.product.products : [];
  if (showMaturity) {
    products = products.filter(p => p.maturity === showMaturity);
  }

  // Build sections based on dimension filter
  let sections = '';

  // Executive Summary (always show)
  sections += `<div class="card-section">
    <h3><span class="section-icon">◈</span> Executive Summary</h3>
    <p class="summary-desc">${d.overall_strategy_summary || ''}</p>
  </div>`;

  // People
  if (!showDimension || showDimension === 'people') {
    const ppl = d.people || {};
    sections += `<div class="card-section" data-dim="people">
      <h3><span class="section-icon">◉</span> People</h3>
      ${ppl.key_leaders ? `<div class="people-grid">${ppl.key_leaders.map(l => `
        <div class="person-chip">
          <div class="person-name">${l.name}</div>
          <div class="person-title">${l.title}</div>
        </div>`).join('')}</div>` : ''}
      ${fieldRow('Team Structure', ppl.team_structure)}
      ${fieldRow('Leadership Commitment', ppl.leadership_commitment)}
      ${fieldRow('Confidence', ppl.confidence)}
    </div>`;
  }

  // Process
  if (!showDimension || showDimension === 'process') {
    const proc = d.process || {};
    sections += `<div class="card-section" data-dim="process">
      <h3><span class="section-icon">◈</span> Process</h3>
      ${fieldRow('Front Office', proc.front_office)}
      ${fieldRow('Middle Office', proc.middle_office)}
      ${fieldRow('Back Office', proc.back_office)}
      ${fieldRow('Operating Model Maturity', proc.operating_model_maturity)}
      ${fieldRow('Regulatory Adaptation', proc.regulatory_adaptation)}
    </div>`;
  }

  // Product
  if (!showDimension || showDimension === 'product') {
    sections += `<div class="card-section" data-dim="product">
      <h3><span class="section-icon">▣</span> Product</h3>
      ${products.length ? `<table class="product-table">
        <tr><th>Product</th><th>Type</th><th>Maturity</th><th>Geography</th><th>Description</th></tr>
        ${products.map(p => `<tr>
          <td style="font-weight:600;color:var(--text)">${p.name}</td>
          <td>${p.type || ''}</td>
          <td>${maturityBadge(p.maturity)}</td>
          <td>${p.geography || ''}</td>
          <td>${p.description || ''}</td>
        </tr>`).join('')}
      </table>` : '<p>No products match current filters.</p>'}
      ${fieldRow('Revenue Intent', d.product ? d.product.revenue_intent : '')}
      ${fieldRow('Build vs Buy', d.product ? d.product.buy_vs_build : '')}
    </div>`;
  }

  // Business View
  if (!showPerspective || showPerspective === 'business') {
    const bv = d.business_view || {};
    sections += `<div class="card-section" data-persp="business">
      <h3><span class="section-icon">◆</span> Business View</h3>
      ${fieldRow('Strategic Rationale', bv.strategic_rationale)}
      ${fieldRow('Revenue Drivers', bv.revenue_drivers)}
      ${fieldRow('Market Positioning', bv.market_positioning)}
      ${fieldRow('Competitive Differentiation', bv.competitive_differentiation)}
      ${fieldRow('Regulatory Posture', bv.regulatory_posture)}
      ${fieldRow('Timing', bv.timing)}
    </div>`;
  }

  // Technology View
  if (!showPerspective || showPerspective === 'technology') {
    const tv = d.technology_view || {};
    sections += `<div class="card-section" data-persp="technology">
      <h3><span class="section-icon">⬡</span> Technology View</h3>
      ${fieldRow('DLT / Blockchain Stack', tv.dlt_stack)}
      ${fieldRow('Chain Posture', tv.chain_posture)}
      ${fieldRow('Wallet Architecture', tv.wallet_architecture)}
      ${fieldRow('Custody Model', tv.custody_model)}
      ${fieldRow('Smart Contracts', tv.smart_contracts)}
      ${fieldRow('Interoperability', tv.interoperability)}
      ${fieldRow('Integration', tv.integration)}
    </div>`;
  }

  // Major Initiatives
  const inits = d.major_initiatives || [];
  sections += `<div class="card-section">
    <h3><span class="section-icon">▶</span> Major Initiatives</h3>
    ${inits.map(i => `<div class="initiative-row">
      <span class="initiative-name">${i.name}</span>
      <span class="initiative-date">${i.date || ''}</span>
      ${maturityBadge(i.status)}
    </div>`).join('')}
  </div>`;

  // Ecosystem Partners
  const partners = d.ecosystem_partners || [];
  sections += `<div class="card-section">
    <h3><span class="section-icon">◎</span> Ecosystem Partners</h3>
    <div class="partners-list">${partners.map(p => `<span class="partner-tag">${p}</span>`).join('')}</div>
  </div>`;

  // Evidence
  const ev = d.evidence || [];
  sections += `<div class="card-section">
    <h3><span class="section-icon">✓</span> Key Evidence (${ev.length})</h3>
    <div class="evidence-list">${ev.map(e => `<div class="evidence-item">
      <div class="ev-claim">${e.claim}</div>
      <div class="ev-meta">${e.source_title || ''} · ${e.source_date || ''} · Confidence: ${e.confidence || 'n/a'}${e.source_url ? ` · <a href="${e.source_url}" target="_blank" rel="noopener">Source ↗</a>` : ''}</div>
    </div>`).join('')}</div>
  </div>`;

  // Open Questions
  const oq = d.open_questions || [];
  sections += `<div class="card-section">
    <h3><span class="section-icon">?</span> Open Questions (${oq.length})</h3>
    <div class="question-list">${oq.map(q => `<div class="question-item">${q}</div>`).join('')}</div>
  </div>`;

  // Analyst Judgment
  const aj = d.analyst_judgment || {};
  sections += `<div class="card-section">
    <h3><span class="section-icon">◈</span> Analyst Judgment</h3>
    <div class="judgment-grid">
      ${judgmentItem('Strategy Posture', aj.strategy_posture)}
      ${judgmentItem('Likely Objectives', aj.likely_objectives)}
      ${judgmentItem('Not Prioritizing', aj.not_prioritizing)}
      ${judgmentItem('Strongest Areas', aj.strongest_areas)}
      ${judgmentItem('Weakest Areas', aj.weakest_areas)}
      ${judgmentItem('Build vs Buy Hypothesis', aj.build_vs_buy_hypothesis)}
    </div>
    ${aj.watchlist_12_months ? `<div style="margin-top:12px">
      <div class="field-label">12-Month Watchlist</div>
      <div class="watchlist-items">${aj.watchlist_12_months.map(w => `<span class="watchlist-tag">${w}</span>`).join('')}</div>
    </div>` : ''}
  </div>`;

  return `<div class="company-card" id="card-${d.slug}" data-slug="${d.slug}">
    <div class="card-header" onclick="toggleCard('${d.slug}')">
      <div class="card-header-info">
        <h2>${d.company_name}</h2>
        <div class="company-type">${d.company_type} · ${d.headquarters}</div>
      </div>
      <div class="card-scores">
        <div class="score-badge"><div class="score-val ${scoreColor(d.strategy_intensity_score)}">${d.strategy_intensity_score}</div><div class="score-label">Strategy</div></div>
        <div class="score-badge"><div class="score-val ${scoreColor(d.business_maturity_score)}">${d.business_maturity_score}</div><div class="score-label">Business</div></div>
        <div class="score-badge"><div class="score-val ${scoreColor(d.technology_maturity_score)}">${d.technology_maturity_score}</div><div class="score-label">Tech</div></div>
      </div>
      <div class="card-expand-icon">▼</div>
    </div>
    <div class="card-body">${sections}</div>
  </div>`;
}

function fieldRow(label, value) {
  if (!value) return '';
  return `<div class="field-row"><div class="field-label">${label}</div><div class="field-value">${value}</div></div>`;
}

function judgmentItem(label, value) {
  if (!value) return '';
  return `<div class="judgment-item"><div class="j-label">${label}</div><div class="j-value">${value}</div></div>`;
}

// ===== COMPARE TABLE =====
function renderCompare() {
  const table = document.getElementById('compare-table');
  const filtered = getFilteredCompanies();
  table.innerHTML = `<thead><tr>
    <th>Company</th><th>Type</th><th>HQ</th>
    <th>Strategy</th><th>Business</th><th>Tech</th>
    <th>Products</th><th>Key Platform</th><th>Posture</th>
  </tr></thead><tbody>${filtered.map(c => {
    const d = companyData[c.slug];
    const prods = d.product && d.product.products ? d.product.products.length : 0;
    const platforms = (d.chain_or_platform_signals || []).slice(0, 3).join(', ');
    const posture = d.analyst_judgment ? d.analyst_judgment.strategy_posture : '';
    return `<tr>
      <td class="company-name-cell">${d.company_name}</td>
      <td>${d.company_type}</td>
      <td>${d.headquarters}</td>
      <td><span class="score-dot" style="background:var(--score-${d.strategy_intensity_score})"></span>${d.strategy_intensity_score}/5</td>
      <td><span class="score-dot" style="background:var(--score-${d.business_maturity_score})"></span>${d.business_maturity_score}/5</td>
      <td><span class="score-dot" style="background:var(--score-${d.technology_maturity_score})"></span>${d.technology_maturity_score}/5</td>
      <td>${prods}</td>
      <td style="font-size:11px">${platforms}</td>
      <td style="font-size:11px;max-width:200px">${posture ? posture.substring(0, 80) + (posture.length > 80 ? '…' : '') : ''}</td>
    </tr>`;
  }).join('')}</tbody>`;
}

// ===== TIMELINE =====
function renderTimeline() {
  const container = document.getElementById('timeline-container');
  let allEvents = [];
  companiesIndex.companies.forEach(c => {
    const d = companyData[c.slug];
    (d.major_initiatives || []).forEach(i => {
      allEvents.push({
        company: d.company_name,
        name: i.name,
        date: i.date || '',
        status: i.status || ''
      });
    });
  });

  // Parse and sort by date
  allEvents.sort((a, b) => {
    const da = parseTimelineDate(a.date);
    const db = parseTimelineDate(b.date);
    return db - da; // newest first
  });

  // Group by year
  const years = {};
  allEvents.forEach(e => {
    const y = extractYear(e.date) || 'Unknown';
    if (!years[y]) years[y] = [];
    years[y].push(e);
  });

  const sortedYears = Object.keys(years).sort((a, b) => b.localeCompare(a));

  container.innerHTML = sortedYears.map(y => `
    <div class="timeline-year">
      <h4>${y}</h4>
      ${years[y].map(e => `<div class="timeline-event">
        <div class="timeline-dot"></div>
        <div class="timeline-company">${e.company}</div>
        <div class="timeline-desc">${e.name} ${maturityBadge(e.status)}</div>
        <div class="timeline-date">${e.date}</div>
      </div>`).join('')}
    </div>
  `).join('');
}

function parseTimelineDate(d) {
  if (!d) return 0;
  const s = d.toString();
  if (s.match(/^\d{4}$/)) return new Date(parseInt(s), 6, 1).getTime();
  if (s.match(/\d{4}-\d{2}/)) return new Date(s).getTime();
  if (s.includes('2026')) return new Date(2026, 1, 1).getTime();
  if (s.includes('2025')) return new Date(2025, 6, 1).getTime();
  if (s.includes('2024')) return new Date(2024, 6, 1).getTime();
  if (s.includes('2023')) return new Date(2023, 6, 1).getTime();
  if (s.includes('2022')) return new Date(2022, 6, 1).getTime();
  if (s.includes('2021')) return new Date(2021, 6, 1).getTime();
  if (s.includes('2017')) return new Date(2017, 6, 1).getTime();
  return 0;
}

function extractYear(d) {
  if (!d) return null;
  const m = d.toString().match(/(20\d{2})/);
  return m ? m[1] : null;
}

// ===== INTERACTIONS =====
function toggleCard(slug) {
  const card = document.getElementById('card-' + slug);
  card.classList.toggle('expanded');
}

function scrollToCompany(slug) {
  // Switch to cards view
  switchView('cards', document.querySelector('[data-view="cards"]'));
  // Expand and scroll
  const card = document.getElementById('card-' + slug);
  if (card) {
    card.classList.add('expanded');
    card.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

function switchView(view, btn) {
  document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('view-' + view).classList.add('active');
  document.querySelectorAll('.sidebar-btn[data-view]').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
}

function toggleFilter(chip) {
  const filter = chip.dataset.filter;
  const val = chip.dataset.val;

  // Toggle active
  if (chip.classList.contains('active')) {
    chip.classList.remove('active');
    activeFilters[filter] = null;
  } else {
    // Deactivate siblings
    document.querySelectorAll(`.filter-chip[data-filter="${filter}"]`).forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    activeFilters[filter] = val;
  }

  renderCards();
  renderCompare();
}

function clearFilters() {
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  activeFilters = { dimension: null, perspective: null, maturity: null, score: null };
  searchQuery = '';
  document.getElementById('search-input').value = '';
  renderCards();
  renderCompare();
}

// Search
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('search-input').addEventListener('input', (e) => {
    searchQuery = e.target.value.trim();
    renderCards();
    renderCompare();
  });
});

// ===== INIT =====
loadData();
</script>
