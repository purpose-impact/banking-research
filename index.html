let AF={score:null};let SQ='';
function init(){rS();rN();rC();rT();document.getElementById('si').addEventListener('input',e=>{SQ=e.target.value.trim();rC();rT()})}
function gF(){let l=CI.companies.slice();if(AF.score)l=l.filter(c=>c.strategy_intensity_score>=parseInt(AF.score));if(SQ){let q=SQ.toLowerCase();l=l.filter(c=>JSON.stringify(CD[c.slug]).toLowerCase().includes(q))}return l}
function rS(){let r=document.getElementById('sr');let cs=CI.companies;let tp=cs.reduce((n,c)=>n+(CD[c.slug].business_segments?CD[c.slug].business_segments.length:0),0);let ae=(cs.reduce((s,c)=>s+c.strategy_intensity_score,0)/cs.length).toFixed(1);r.innerHTML=`<div class="sc"><div class="l">Companies</div><div class="v">${cs.length}</div></div><div class="sc"><div class="l">Avg Strategy</div><div class="v">${ae}</div></div><div class="sc"><div class="l">Segments</div><div class="v">${tp}</div></div><div class="sc"><div class="l">Scope</div><div class="v" style="font-size:13px">Holistic</div></div>`}
function rN(){let n=document.getElementById('cn');n.innerHTML=CI.companies.map(c=>`<button class="sb-b" onclick="sc('${c.slug}')">${c.company_name} <span style="float:right;color:var(--t3);font-size:10px">${c.strategy_intensity_score}/5</span></button>`).join('')}
function fR(l,v){if(!v)return'';return`<div class="fr"><div class="fl">${l}</div><div class="fv">${v}</div></div>`}
function bM(p){if(!p)return'';let m={'core':'b-c','growth':'b-g','restructuring':'b-r'};return`<span class="bd ${m[p]||'b-c'}">${p}</span>`}
function bC(d){let S='';
S+=`<div class="cx"><h3>Executive Summary</h3><p style="font-family:var(--fb);line-height:1.65">${d.summary||''}</p></div>`;
S+=`<div class="cx"><h3>Key Financials</h3>${fR('Revenue',d.revenue)}${fR('Profitability',d.profit_metric)}${fR('Employees',d.employees)}${fR('Key Stat',d.key_stat)}</div>`;
let bs=d.business_segments||[];if(bs.length)S+=`<div class="cx"><h3>Business Segments</h3><table class="pt"><tr><th>Segment</th><th>Detail</th><th>Priority</th></tr>${bs.map(s=>`<tr><td style="font-weight:600;color:var(--t)">${s.name}</td><td>${s.detail||''}</td><td>${bM(s.priority)}</td></tr>`).join('')}</table></div>`;
let tc=d.technology||{};if(Object.keys(tc).length)S+=`<div class="cx"><h3>Technology Strategy</h3>${fR('AI & GenAI',tc.ai)}${fR('Cloud',tc.cloud)}${fR('Data & Analytics',tc.data)}${fR('Platforms',tc.platforms)}${fR('Tech Spend',tc.spend)}</div>`;
if(d.operating_model)S+=`<div class="cx"><h3>Operating Model</h3><p>${d.operating_model}</p></div>`;
let pp=d.people||[];if(pp.length)S+=`<div class="cx"><h3>People & Leadership</h3><div class="pg">${pp.map(p=>`<div class="pc"><div class="pn">${p.name}</div><div class="pr">${p.role}</div></div>`).join('')}</div></div>`;
let pa=d.partnerships||[];if(pa.length)S+=`<div class="cx"><h3>Partnerships</h3><div class="tg">${pa.map(p=>`<span class="tgi">${p}</span>`).join('')}</div></div>`;
let op=d.opportunities||[];if(op.length)S+=`<div class="cx"><h3>Opportunities</h3><ul>${op.map(o=>`<li>${o}</li>`).join('')}</ul></div>`;
let po=d.partnership_opps||[];if(po.length)S+=`<div class="cx"><h3>Product & Partnership Opportunities</h3><ul>${po.map(o=>`<li>${o}</li>`).join('')}</ul></div>`;
let sg=d.skills_gaps||[];if(sg.length)S+=`<div class="cx"><h3>Skills Gaps</h3><div class="tg">${sg.map(s=>`<span class="tgi">${s}</span>`).join('')}</div></div>`;
let ri=d.risks||[];if(ri.length)S+=`<div class="cx"><h3>Risks</h3><ul>${ri.map(r=>`<li>${r}</li>`).join('')}</ul></div>`;
let ev=d.evidence||[];if(ev.length)S+=`<div class="cx"><h3>Evidence (${ev.length})</h3>${ev.map(e=>`<div class="ev"><div class="ec">${e.claim}</div><div class="em">${e.source||''} &middot; ${e.date||''}</div></div>`).join('')}</div>`;
let qq=d.questions||[];if(qq.length)S+=`<div class="cx"><h3>Open Questions (${qq.length})</h3>${qq.map(q=>`<div class="qi">${q}</div>`).join('')}</div>`;
if(d.analyst_view)S+=`<div class="cx"><h3>Analyst View</h3><p style="line-height:1.65">${d.analyst_view}</p></div>`;
if(d.competitive_position)S+=`<div class="cx"><h3>Competitive Position</h3><p>${d.competitive_position}</p></div>`;
let si=d.strategy_intensity_score||3,bi=d.business_maturity_score||3,ti=d.technology_maturity_score||3;
